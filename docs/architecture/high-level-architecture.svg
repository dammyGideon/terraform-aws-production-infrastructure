<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Elthebel AWS High-Level Architecture</title>
  <desc id="desc">High-level AWS architecture showing internet users, application load balancer, public and private subnets, EC2 Auto Scaling, CloudWatch, and SNS alerts.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d7dde8; stroke-width: 2; rx: 12; }
      .aws { fill: #fff7e6; stroke: #f5a623; stroke-width: 2; rx: 14; }
      .vpc { fill: #eef7ff; stroke: #2f80ed; stroke-width: 2; rx: 12; }
      .public { fill: #e9f8ef; stroke: #27ae60; stroke-width: 2; rx: 10; }
      .private { fill: #f4efff; stroke: #7b61ff; stroke-width: 2; rx: 10; }
      .service { fill: #ffffff; stroke: #44546a; stroke-width: 2; rx: 8; }
      .security { fill: #fff2f0; stroke: #d64545; stroke-width: 2; rx: 8; }
      .monitor { fill: #eef8f8; stroke: #0e7c86; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; fill: #516070; }
      .line { stroke: #44546a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #0e7c86; stroke-width: 2.5; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow-teal); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#44546a"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0e7c86"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <text x="48" y="54" class="text title">Elthebel AWS Infrastructure</text>
  <text x="48" y="82" class="text small">Public ALB routes traffic to private EC2 instances managed by Auto Scaling, with CloudWatch monitoring and SNS alerts.</text>

  <rect x="48" y="130" width="150" height="95" class="panel"/>
  <text x="123" y="164" text-anchor="middle" class="text label">Internet</text>
  <text x="123" y="190" text-anchor="middle" class="text small">Users</text>

  <rect x="260" y="110" width="930" height="560" class="aws"/>
  <text x="290" y="148" class="text label">AWS Account</text>

  <rect x="300" y="180" width="620" height="430" class="vpc"/>
  <text x="330" y="216" class="text label">VPC</text>
  <text x="330" y="240" class="text tiny">DNS support and hostnames enabled</text>

  <rect x="335" y="270" width="250" height="270" class="public"/>
  <text x="360" y="302" class="text label">Public Subnets</text>
  <text x="360" y="326" class="text tiny">Multi-AZ public tier</text>

  <rect x="635" y="270" width="250" height="270" class="private"/>
  <text x="660" y="302" class="text label">Private Subnets</text>
  <text x="660" y="326" class="text tiny">Application tier</text>

  <rect x="370" y="360" width="180" height="72" class="service"/>
  <text x="460" y="392" text-anchor="middle" class="text label">ALB</text>
  <text x="460" y="416" text-anchor="middle" class="text tiny">HTTP listener :80</text>

  <rect x="370" y="460" width="180" height="54" class="service"/>
  <text x="460" y="493" text-anchor="middle" class="text small">NAT Gateway</text>

  <rect x="674" y="352" width="172" height="78" class="service"/>
  <text x="760" y="385" text-anchor="middle" class="text label">Target Group</text>
  <text x="760" y="410" text-anchor="middle" class="text tiny">/health checks</text>

  <rect x="674" y="462" width="172" height="54" class="service"/>
  <text x="760" y="494" text-anchor="middle" class="text small">EC2 Auto Scaling</text>

  <rect x="960" y="230" width="180" height="70" class="security"/>
  <text x="1050" y="262" text-anchor="middle" class="text label">IAM + SSM</text>
  <text x="1050" y="286" text-anchor="middle" class="text tiny">Instance profile</text>

  <rect x="960" y="344" width="180" height="76" class="monitor"/>
  <text x="1050" y="377" text-anchor="middle" class="text label">CloudWatch</text>
  <text x="1050" y="402" text-anchor="middle" class="text tiny">Dashboard + alarms</text>

  <rect x="960" y="462" width="180" height="70" class="monitor"/>
  <text x="1050" y="494" text-anchor="middle" class="text label">SNS</text>
  <text x="1050" y="518" text-anchor="middle" class="text tiny">Email alerts</text>

  <path d="M198 178 H370" class="line"/>
  <path d="M550 396 H674" class="line"/>
  <path d="M760 430 V462" class="line"/>
  <path d="M846 489 H960" class="dash"/>
  <path d="M846 391 H960" class="dash"/>
  <path d="M1050 420 V462" class="dash"/>
  <path d="M960 265 H846" class="dash"/>

  <rect x="48" y="640" width="1142" height="70" class="panel"/>
  <text x="72" y="674" class="text small">Traffic path: Internet Users -> ALB -> HTTP Listener -> Target Group -> EC2 Auto Scaling Group -> Nginx instances</text>
  <text x="72" y="698" class="text tiny">Operations path: CloudWatch tracks ALB, target health, ASG capacity, CPU, and sends unhealthy target alerts through SNS email.</text>
</svg>
