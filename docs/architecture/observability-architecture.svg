<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Elthebel Observability Architecture</title>
  <desc id="desc">Observability module diagram showing CloudWatch dashboard widgets, Application Load Balancer metrics, Auto Scaling metrics, EC2 CPU metrics, CloudWatch alarm, SNS topic, and email alerts.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .source { fill: #ffffff; stroke: #44546a; stroke-width: 2; rx: 8; }
      .cloudwatch { fill: #eef8f8; stroke: #0e7c86; stroke-width: 2; rx: 12; }
      .alarm { fill: #fff7e6; stroke: #f5a623; stroke-width: 2; rx: 8; }
      .sns { fill: #fff2f0; stroke: #d64545; stroke-width: 2; rx: 8; }
      .widget { fill: #ffffff; stroke: #0e7c86; stroke-width: 1.5; rx: 7; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; fill: #516070; }
      .line { stroke: #44546a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #0e7c86; stroke-width: 2.5; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow-teal); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#44546a"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0e7c86"/></marker>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <text x="48" y="54" class="text title">Observability Module</text>
  <text x="48" y="82" class="text small">CloudWatch dashboard and alerting for ALB health, traffic, latency, Auto Scaling capacity, and EC2 CPU utilization.</text>

  <rect x="70" y="150" width="220" height="72" class="source"/>
  <text x="180" y="184" text-anchor="middle" class="text label">ALB</text>
  <text x="180" y="208" text-anchor="middle" class="text tiny">AWS/ApplicationELB</text>

  <rect x="70" y="275" width="220" height="72" class="source"/>
  <text x="180" y="309" text-anchor="middle" class="text label">Target Group</text>
  <text x="180" y="333" text-anchor="middle" class="text tiny">Healthy target metrics</text>

  <rect x="70" y="400" width="220" height="72" class="source"/>
  <text x="180" y="434" text-anchor="middle" class="text label">Auto Scaling</text>
  <text x="180" y="458" text-anchor="middle" class="text tiny">Capacity metrics</text>

  <rect x="70" y="525" width="220" height="72" class="source"/>
  <text x="180" y="559" text-anchor="middle" class="text label">EC2</text>
  <text x="180" y="583" text-anchor="middle" class="text tiny">CPU utilization</text>

  <rect x="405" y="130" width="445" height="500" class="cloudwatch"/>
  <text x="440" y="170" class="text label">CloudWatch Operations Dashboard</text>
  <rect x="445" y="215" width="170" height="78" class="widget"/>
  <text x="530" y="247" text-anchor="middle" class="text small">Target Availability</text>
  <text x="530" y="270" text-anchor="middle" class="text tiny">Healthy / unhealthy hosts</text>
  <rect x="645" y="215" width="170" height="78" class="widget"/>
  <text x="730" y="247" text-anchor="middle" class="text small">Traffic + Errors</text>
  <text x="730" y="270" text-anchor="middle" class="text tiny">Requests and 5XX</text>
  <rect x="445" y="335" width="170" height="78" class="widget"/>
  <text x="530" y="367" text-anchor="middle" class="text small">Latency</text>
  <text x="530" y="390" text-anchor="middle" class="text tiny">Target response time</text>
  <rect x="645" y="335" width="170" height="78" class="widget"/>
  <text x="730" y="367" text-anchor="middle" class="text small">ASG Capacity</text>
  <text x="730" y="390" text-anchor="middle" class="text tiny">Desired / in service</text>
  <rect x="535" y="455" width="190" height="78" class="widget"/>
  <text x="630" y="487" text-anchor="middle" class="text small">Resource Saturation</text>
  <text x="630" y="510" text-anchor="middle" class="text tiny">Average EC2 CPU</text>

  <rect x="960" y="220" width="220" height="84" class="alarm"/>
  <text x="1070" y="253" text-anchor="middle" class="text label">CloudWatch Alarm</text>
  <text x="1070" y="278" text-anchor="middle" class="text tiny">UnHealthyHostCount &gt;= 1</text>

  <rect x="960" y="390" width="220" height="78" class="sns"/>
  <text x="1070" y="423" text-anchor="middle" class="text label">SNS Topic</text>
  <text x="1070" y="447" text-anchor="middle" class="text tiny">operations-alerts</text>

  <rect x="960" y="550" width="220" height="78" class="sns"/>
  <text x="1070" y="583" text-anchor="middle" class="text label">Email</text>
  <text x="1070" y="607" text-anchor="middle" class="text tiny">Requires confirmation</text>

  <path d="M290 186 H405" class="dash"/>
  <path d="M290 311 H405" class="dash"/>
  <path d="M290 436 H405" class="dash"/>
  <path d="M290 561 H405" class="dash"/>
  <path d="M850 262 H960" class="line"/>
  <path d="M1070 304 V390" class="line"/>
  <path d="M1070 468 V550" class="line"/>
</svg>
